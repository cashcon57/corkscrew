[package]
name = "corkscrew"
version = "0.16.5"
description = "A mod manager for CrossOver/Wine games on macOS and Linux"
authors = ["cashconway"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "corkscrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "ac709a71d30ac2f167dd79c4f803500a236262f6" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.39", features = ["bundled"] }

# HTTP client (for Nexus API)
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Archive extraction
zip = "2"
sevenz-rust2 = "0.20"
unrar = "0.5"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
bzip2 = "0.6"

# XML parsing (FOMOD)
quick-xml = { version = "0.38", features = ["serialize"] }

# File system utilities
walkdir = "2"
dirs = "6"
rayon = "1"
memmap2 = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# UE5 PAK file read/write (Hogwarts Legacy mod merger)
repak = { git = "https://github.com/trumank/repak", tag = "v0.2.3" }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# URL parsing
url = "2"

# Futures/streams for downloads
futures = "0.3"

# Window vibrancy (macOS only — compiled but unused on Linux; usage is cfg-gated)
window-vibrancy = "0.7"

# Hashing (for version detection)
sha2 = "0.11"

# LOOT integration (plugin sorting + load order)
libloot = "0.29"

# ESP/ESM/ESL record-level parsing (conflict detection)
esplugin = "6"

# WebSocket (Nexus Mods SSO)
# Uses rustls + Mozilla webpki-roots (no system OpenSSL dep) to align with the rest
# of the TLS stack (reqwest also uses rustls). Drops OpenSSL from the SSO path.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# System info (disk space)
libc = "0.2"

# LRU cache (FOMOD parsing)
lru = "0.16"

# Regex (instruction parser)
regex = "1"

# Wabbajack install pipeline
xxhash-rust = { version = "0.8", features = ["xxh64"] }
base64 = "0.22"
zstd = "0.13"
lz4_flex = "0.11"  # LZ4 decompression for LSPK (BG3 .pak) file tables and entries
mega = "0.8"
scraper = "0.26"
qbsdiff = "1"

# BSA/BA2 archive creation (Bethesda game archives)
ba2 = "3"

# DDS texture transformation
image = "0.25"
ddsfile = "0.5"
image_dds = { version = "0.7", features = ["ddsfile", "image"] }

# PE parsing (SKSE plugin version detection)
pelite = "0.10"

# Embedded JS engine (Vortex extension execution)
rquickjs = { version = "0.11", features = ["futures", "parallel", "loader", "macro", "rust-alloc"] }

# UUID generation (FOMOD correlation IDs)
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
crc32fast = "1.5.0"

# Self-update (macOS app replacement fallback)
tempfile = "3"

# File timestamp manipulation (preserve mtime when copying save backups,
# deterministic mtime control in crash-log dedup tests).
filetime = "0.2"

# Windows .lnk shortcut parsing (CrossOver bottle game auto-discovery).
# Parses the Start Menu / Desktop shortcuts CrossOver creates per app to
# surface unregistered games in the UI without requiring CLI use.
parselnk = { version = "0.1", default-features = false }

# TOML parsing/serialization (FromSoft Mod Engine 2 config files).
# Preserves table-of-arrays layout for `[[extension.mod_loader.mods]]`.
toml = { version = "0.8", features = ["preserve_order"] }

# Info.plist reader (macOS .app bundle metadata — XML and binary plist support).
plist = "1"

# WebDriver E2E testing — debug builds only, compiled out of release
[target.'cfg(debug_assertions)'.dependencies]
tauri-plugin-webdriver = "0.2"

# ── Release profile optimizations ─────────────────────────
# Default Cargo release: fat LTO + 16 codegen units = very slow builds.
# thin-lto is 2-3x faster with negligible runtime difference.
# strip removes debug symbols (smaller binary, faster link).
[profile.release]
lto = "thin"
strip = true
codegen-units = 16

[dev-dependencies]
