version: 2
# Monthly, grouped updates to keep PR volume low. Each ecosystem gets one
# minor/patch group PR; majors still arrive as individual PRs.
# Tauri npm + cargo packages must be version-matched, so each ecosystem keeps
# a dedicated `tauri` group and both run on the same monthly day.
updates:
  # npm — frontend (Svelte, Tauri JS bindings)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(npm):"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      # SvelteKit doesn't support TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Cargo — Rust backend (Tauri, rusqlite, reqwest, etc.)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(cargo):"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(actions):"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
