name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only Dependabot's own PRs (actor AND PR author), never human PRs.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Decide eligibility
        id: eligible
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEP_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          ok=false
          # Patch updates: non-breaking by semver.
          [ "$UPDATE_TYPE" = "version-update:semver-patch" ] && ok=true
          # GitHub Actions and dev dependencies: minor + patch.
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            [ "$ECOSYSTEM" = "github_actions" ] && ok=true
            [ "$DEP_TYPE" = "direct:development" ] && ok=true
          fi
          echo "ok=$ok" | tee -a "$GITHUB_OUTPUT"

      # WebdriverIO isn't a required check (and is continue-on-error), so
      # `gh pr merge --auto` would ignore it. Wait for it explicitly and only
      # merge if it passed or was skipped (no src-tauri / e2e-wdio changes).
      - name: Wait for E2E WebdriverIO
        if: steps.eligible.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 100); do
            # Ignore cancelled runs (superseded by a newer CI run on the same
            # SHA) and judge only the newest remaining WebdriverIO check run.
            latest=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=E2E%20WebdriverIO&filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.conclusion != "cancelled")]
                    | sort_by(.started_at // "", .completed_at // "") | last
                    | if . == null then "" else "\(.status) \(.conclusion // "")" end')
            status=${latest%% *}; res=${latest#* }
            if [ "$status" = "completed" ] && [ -n "$res" ]; then
              echo "E2E WebdriverIO (latest non-cancelled run): $res"
              case "$res" in success|skipped|neutral) exit 0 ;; *) echo "WebdriverIO did not pass; not auto-merging."; exit 1 ;; esac
            fi
            sleep 30
          done
          echo "Timed out waiting for E2E WebdriverIO; not auto-merging."; exit 1

      - name: Approve and enable auto-merge
        if: steps.eligible.outputs.ok == 'true'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
