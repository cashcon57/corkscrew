name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  # ────────────────────────────────────────────────────────
  # Rust: clippy + tests (the only Rust job needed — tests
  # prove it compiles, so a separate cargo check is waste)
  # ────────────────────────────────────────────────────────
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev mold clang

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy -- --allow clippy::too_many_arguments --allow clippy::type_complexity

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  # ────────────────────────────────────────────────────────
  # Frontend: build + type-check (no Rust needed here)
  # ────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Svelte type check
        run: npx svelte-check --threshold error

  # ────────────────────────────────────────────────────────
  # Tier 1 E2E: Playwright (mocked IPC, no build needed)
  # WebKit only — that's the actual engine Tauri uses.
  # Chromium is irrelevant (Corkscrew never runs in Chrome).
  # Both OS: WKWebView (macOS) and WebKitGTK (Linux) have
  # real rendering differences worth catching.
  # ────────────────────────────────────────────────────────
  e2e-playwright:
    name: E2E Playwright (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run Playwright E2E tests
        run: |
          # Playwright WebKit sometimes exits with code 1 even when all tests
          # pass (browser process cleanup issue). Parse the stdout summary to
          # determine pass/fail instead of trusting the exit code.
          set +e
          npx playwright test --project=webkit 2>&1 | tee /tmp/pw-output.txt
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            # Check if the summary line shows 0 failures
            if grep -qE '^\s+[0-9]+ passed' /tmp/pw-output.txt && ! grep -qE '[0-9]+ failed' /tmp/pw-output.txt; then
              echo "✓ All tests passed (exit code $EXIT_CODE ignored — WebKit process cleanup issue)"
              exit 0
            fi
          fi
          exit $EXIT_CODE
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────
  # Tier 2 E2E: WebdriverIO (real binary, real IPC)
  # Only on PRs — not every push to main.
  # Only Linux — macOS is 10x cost and tests the same app logic.
  # continue-on-error: advisory until the suite is fully stable.
  # ────────────────────────────────────────────────────────
  e2e-webdriverio:
    name: E2E WebdriverIO
    if: github.event_name == 'pull_request'
    needs: [test-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev mold clang xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e-wdio
        run: npm ci

      - name: Build Tauri app (debug)
        working-directory: src-tauri
        run: cargo build

      - name: Run WebdriverIO E2E tests
        working-directory: e2e-wdio
        run: xvfb-run --auto-servernum npx wdio run wdio.conf.ts
        env:
          CI: true

      - name: Upload WDIO logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs
          path: e2e-wdio/logs/
          retention-days: 7
