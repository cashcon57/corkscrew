name: Update Game Stats

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stats:
    name: Update NexusMods Game Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch NexusMods stats and generate reports
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: python3 scripts/update-game-stats.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md GAME_SUPPORT_REPORT.md && \
             git diff --quiet --cached && \
             [ -z "$(git ls-files --others --exclude-standard stats/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request with updated stats
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.STATS_PR_TOKEN }}
          branch: bot/update-game-stats
          base: main
          delete-branch: true
          commit-message: Update game support stats from NexusMods API
          title: Update game support stats from NexusMods API
          body: |
            Automated update from the NexusMods API.

            Updates README.md, GAME_SUPPORT_REPORT.md, and stats/ (game stats history).
            Generated by the scheduled "Update Game Stats" workflow — please review and merge; this replaces the previous direct push to protected `main`.
          add-paths: |
            README.md
            GAME_SUPPORT_REPORT.md
            stats/
